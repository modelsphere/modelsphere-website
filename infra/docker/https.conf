ssl_certificate /etc/modelsphere/tls/fullchain.pem;
ssl_certificate_key /etc/modelsphere/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;

server {
    listen 8080;
    server_name _;
    return 308 https://modelsphere.tech$request_uri;
}

server {
    listen 8443 ssl;
    server_name www.modelsphere.tech;
    return 308 https://modelsphere.tech$request_uri;
}
