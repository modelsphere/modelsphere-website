# Match public entry pages only. $request_uri stays unchanged when try_files
# internally resolves the request to an HTML file.
map $request_uri $english_entry {
    default "";
    ~^__SITE_BASE__(?<entry>models|model|recipe|docs|blog|community)?(?:\?|$) __SITE_BASE__en/$entry;
}

# A leading unweighted language (or q=1) is a browser's top preference.
# Let the existing HTML fallback handle ambiguous weighted or wildcard headers.
map $http_accept_language $browser_locale {
    default "";
    "~*^zh(?:-|,|;|\s|$)" zh-CN;
    "~*^[a-z][a-z0-9-]*\s*(?:;\s*q=1(?:\.0+)?)?\s*(?:,|$)" en;
}

map $cookie_ms_locale $preferred_locale {
    default $browser_locale;
    zh-CN zh-CN;
    en en;
}

map $arg_ms_lang $explicit_chinese {
    default 0;
    zh-CN 1;
}

map "$request_method:$explicit_chinese:$preferred_locale:$english_entry" $locale_redirect {
    default "";
    ~^(GET|HEAD):0:en:/ $english_entry;
}

map $english_entry $locale_vary {
    "" "";
    default "Cookie, Accept-Language";
}

map $english_entry $locale_cache_control {
    "" "";
    default "private, no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Vary $locale_vary always;
    add_header Cache-Control $locale_cache_control always;

    if ($locale_redirect) {
        return 302 $locale_redirect$is_args$args;
    }

    location / { try_files $uri $uri.html $uri/index.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
