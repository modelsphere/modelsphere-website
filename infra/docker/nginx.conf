server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri.html $uri/index.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
