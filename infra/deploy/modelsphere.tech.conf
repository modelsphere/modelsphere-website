server {
    listen 80;
    server_name modelsphere.tech;
    return 308 https://modelsphere.tech$request_uri;
}

server {
    listen 443 ssl;
    server_name modelsphere.tech;
    ssl_certificate /etc/modelsphere-website/tls-paths/fullchain.pem;
    ssl_certificate_key /etc/modelsphere-website/tls-paths/privkey.pem;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name modelsphere.tech;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}
